name: Release on PR Merge

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Manual version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    name: Conventional Commits Release & Build
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On PR close the default ref is refs/pull/N/merge; release from the real base branch.
          ref: ${{ github.event.pull_request.base.ref || github.ref_name }}

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analyze Conventional Commits & Determine Version
        id: semver
        run: |
          python scripts/release_helper.py --event-path "$env:GITHUB_EVENT_PATH" --output-file "$env:GITHUB_OUTPUT" --changelog-file "changelog.md" --update-manifest

      - name: Log Release Decision
        run: |
          Write-Host "Should Release: ${{ steps.semver.outputs.should_release }}"
          if ("${{ steps.semver.outputs.should_release }}" -eq "true") {
            Write-Host "New Version: ${{ steps.semver.outputs.version }}"
            Write-Host "Tag Name: ${{ steps.semver.outputs.tag_name }}"
            Write-Host "Bump Type: ${{ steps.semver.outputs.bump_type }}"
            Write-Host "Previous Tag: ${{ steps.semver.outputs.previous_tag }}"
            Write-Host "Release Title: ${{ steps.semver.outputs.release_title }}"
            Write-Host "--- Changelog Preview ---"
            Get-Content -Path "changelog.md"
          } else {
            Write-Host "Skipping release: No releasing conventional commit types (feat/fix/breaking) found."
          }

      - name: Install GNU Make
        if: steps.semver.outputs.should_release == 'true'
        run: choco install make -y

      - name: Install Mad-Assembler (MADS)
        if: steps.semver.outputs.should_release == 'true'
        run: |
          $madsDir = "C:\Apps\Mad-Assembler-2.1.6\bin\windows_x86_64"
          New-Item -ItemType Directory -Force -Path $madsDir | Out-Null
          curl.exe -L -f -s -S "https://raw.githubusercontent.com/tebe6502/Mad-Assembler/2.1.6/bin/windows_x86_64/mads.exe" -o "$madsDir\mads.exe"
          if (!(Test-Path "$madsDir\mads.exe")) { throw "MADS download failed" }

      - name: Build Atari XEX
        if: steps.semver.outputs.should_release == 'true'
        run: |
          make all
          if (!(Test-Path "call_of_the_wintermon.xex")) {
            Write-Error "Build failed: call_of_the_wintermon.xex was not generated!"
            exit 1
          }
          Write-Host "Successfully built call_of_the_wintermon.xex ($((Get-Item call_of_the_wintermon.xex).Length) bytes)"

      - name: Commit & Push updated manifest.yaml to main
        if: steps.semver.outputs.should_release == 'true'
        id: push_manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml
          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(release): bump manifest version to ${{ steps.semver.outputs.version }} [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "No changes in manifest.yaml to commit."
          }
          "sha=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        if: steps.semver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.semver.outputs.tag_name }}
          target_commitish: ${{ steps.push_manifest.outputs.sha }}
          name: ${{ steps.semver.outputs.release_title }}
          body_path: changelog.md
          files: |
            call_of_the_wintermon.xex
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

