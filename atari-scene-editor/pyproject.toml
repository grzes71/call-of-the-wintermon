[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atari-scene-editor"
version = "1.0.0"
description = "Desktop scene editor for Atari 8-bit platformer games"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.5.0",
    "pillow>=10.0.0",
]

[project.scripts]
atari-scene-editor = "scene_editor.app:main"

[tool.setuptools.packages.find]
where = ["src"]
